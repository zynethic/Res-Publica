name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setujui Lisensi Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build
          npx cap add android || true
          npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Siapkan Penamaan Berkas APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ResPublica-${{ github.ref_name }}.apk

      - name: Terbitkan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Res Publica ${{ github.ref_name }}
          body: |
            Rilis resmi Res Publica versi ${{ github.ref_name }}.
            - Commit: `${{ github.sha }}`
          files: ResPublica-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
